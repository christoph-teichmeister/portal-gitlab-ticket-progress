name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check portal-gitlab-ticket-progress.js
      - name: Pure function checks
        run: node tests/pure.check.js
      - name: Lint (errors only)
        run: |
          npm install --no-save --legacy-peer-deps eslint@9 @eslint/js@9 globals
          npx eslint -c eslint.config.js portal-gitlab-ticket-progress.js tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node tests/browser.check.js

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check portal-gitlab-ticket-progress.js
      - name: Pure function checks
        run: node tests/pure.check.js
      - name: Version header matches SCRIPT_VERSION
        run: |
          header=$(grep -m1 '@version' portal-gitlab-ticket-progress.js | awk '{print $3}')
          const=$(grep -m1 "const SCRIPT_VERSION" portal-gitlab-ticket-progress.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "header=$header const=$const"
          test "$header" = "$const"
